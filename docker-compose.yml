version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: o2h-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: o2h_chat
      MYSQL_USER: o2h
      MYSQL_PASSWORD: o2h_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: o2h-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://o2h:o2h_password@db:3306/o2h_chat"
      JWT_SECRET: o2h_production_secret_key_2026
      JWT_REFRESH_SECRET: o2h_production_refresh_key_2026
      CLIENT_URL: "http://localhost:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: o2h-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
      NEXT_PUBLIC_WS_URL: "http://localhost:5000"
    depends_on:
      - server

volumes:
  mysql_data:
  uploads_data:
